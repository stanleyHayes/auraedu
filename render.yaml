          property: connectionString
      - key: GATEWAY_CORS_ORIGINS
        value: https://auraedugh.vercel.app,https://auraedugh-marketing.vercel.app
      - key: GATEWAY_TRUSTED_PROXY
        value: render
      - key: IDENTITY_HOSTPORT
        fromService:
          name: identity-service
          type: pserv
          property: hostport
      - key: TENANT_HOSTPORT
